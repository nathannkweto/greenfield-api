type Lecturer {
    id: ID! @rename(attribute: "public_id")
    firstName: String! @rename(attribute: "first_name")
    middleName: String @rename(attribute: "middle_name")
    lastName: String! @rename(attribute: "last_name")
    dob: Date @rename(attribute: "dob")
    address: String @rename(attribute: "address")
    emergencyContact: String @rename(attribute: "emergency_contact")

    user: User! @belongsTo
    school: School! @belongsTo
    curricula: [Curriculum!]! @hasMany

    createdAt: DateTime! @rename(attribute: "created_at")
    updatedAt: DateTime! @rename(attribute: "updated_at")
}
