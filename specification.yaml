    FeeRequest:
      type: object
      required:
        - title
        - amount_zmw
        - frequency
        - account_id
      properties:
        title:
          type: string
          example: "Tuition Fee - B.Sc. Computer Science"
        amount_zmw:
          type: number
          format: float
          minimum: 0
          example: 7500.00
        amount_usd:
          type: number
          format: float
          nullable: true
          minimum: 0
          example: 300.00
        frequency:
          type: string
          enum:
            - monthly
            - termly
            - yearly
            - one_time
          example: "termly"
        account_id:
          type: integer
          description: "Database ID of the Chart of Accounts GL revenue account."
          example: 1
        program_public_id:
          type: string
          format: uuid
          nullable: true
          description: "When supplied, backend auto-sets feeable_type='Program' and feeable_public_id to this value."
          example: "9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d"
        feeable_type:
          type: string
          nullable: true
          enum:
            - Program
            - Student
          description: "Polymorphic model type. Set to 'Program' when scoped to a program, or null for Global fees."
          example: "Program"
        feeable_public_id:
          type: string
          format: uuid
          nullable: true
          description: "Public UUID of the attached Program or Student."
          example: "9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d"

