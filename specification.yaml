            account_number:
              type: string
              example: "4010"
            name:
              type: string
              example: "Tuition Fee Revenue"
            type:
              type: string
              example: "revenue"
        feeable_type:
          type: string
          nullable: true
          example: "Program"
        feeable_id:
          type: integer
          nullable: true
          example: 12

